<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="45%" stop-color="#151a3d"/>
      <stop offset="100%" stop-color="#2c1250"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="60%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#075985"/>
    </radialGradient>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>
  <circle cx="770" cy="60" r="120" fill="url(#glow)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.6"><animate attributeName="opacity" values="1;0.15;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="95" cy="70" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="25" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="55" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="15" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="80" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="35" r="1.7"><animate attributeName="opacity" values="1;0.25;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="20" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="150" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="180" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="195" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="160" r="1.5"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="190" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="40" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="90" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="150" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="180" r="1.3"><animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="150" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="190" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shooting star -->
  <g>
    <line x1="0" y1="0" x2="60" y2="20" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="-80,-20; 500,140; 500,140" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="4.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- orbiting planet, top right -->
  <circle cx="800" cy="55" r="26" fill="url(#planetGlow)"/>
  <ellipse cx="800" cy="55" rx="42" ry="10" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.7" transform="rotate(-18 800 55)"/>
  <circle r="4" fill="#facc15">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 758,55 A 42,10 -18 1 1 842,55 A 42,10 -18 1 1 758,55"/>
  </circle>

  <!-- flying rocket, arcs across the whole banner -->
  <g>
    <g transform="rotate(35)">
      <path d="M0,-14 C8,-8 8,8 0,14 C-8,8 -8,-8 0,-14 Z" fill="#e2e8f0"/>
      <path d="M0,-14 C8,-8 8,8 0,14" fill="none"/>
      <circle cx="0" cy="-2" r="3.2" fill="#38bdf8"/>
      <path d="M-3,10 L-9,20 L-2,16 Z" fill="#f97316"/>
      <path d="M3,10 L9,20 L2,16 Z" fill="#f97316"/>
      <path d="M0,14 L-3,24 L3,24 Z" fill="#facc15">
        <animate attributeName="opacity" values="1;0.4;1" dur="0.25s" repeatCount="indefinite"/>
      </path>
    </g>
    <animateMotion dur="7s" repeatCount="indefinite" path="M -40,210 C 150,120 300,60 450,90 C 620,125 720,40 940,-30"/>
  </g>

  <!-- tagline only, no name (already shown in header banner above) -->
  <text x="60" y="120" font-family="Segoe UI, Verdana, sans-serif" font-size="18" fill="#a5b4fc" letter-spacing="1">
    Currently orbiting: AI × Healthcare × Deployment
  </text>
</svg>
